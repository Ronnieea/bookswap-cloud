name: Deploy BookSwap Backend

on:
  workflow_run:
    workflows:
      - "BookSwap CI"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookswap-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Lambda
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          mkdir -p lambda-package
          python -m pip install \
            -r backend/requirements.txt \
            --target lambda-package/

      - name: Copy application code
        run: |
          cp -R backend/app lambda-package/app

      - name: Verify Lambda package
        run: |
          test -f lambda-package/app/main.py
          test -d lambda-package/fastapi
          test -d lambda-package/mangum
          test -d lambda-package/boto3
          test -d lambda-package/pydantic_core

          test ! -d lambda-package/tests
          test ! -d lambda-package/.venv
          test ! -d lambda-package/.venv-python313-backup

          PYTHONPATH=lambda-package \
            python -c "from app.main import handler; print('Handler import OK')"

      - name: Create Lambda ZIP
        run: |
          cd lambda-package
          zip -qr ../bookswap-lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name bookswap-api \
            --zip-file fileb://bookswap-lambda.zip \
            --region ap-southeast-2 \
            --query '{FunctionName:FunctionName,LastModified:LastModified,CodeSha256:CodeSha256}' \
            --output json

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name bookswap-api \
            --region ap-southeast-2

      - name: API smoke test
        run: |
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://a6gsap9tp1.execute-api.ap-southeast-2.amazonaws.com/prod/books \
            -o response.json

          python -c "
          import json
          with open('response.json') as f:
              data = json.load(f)
          assert isinstance(data, list), 'Expected a list of books'
          print('Backend API smoke test passed')
          "

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookswap-lambda-package
          path: bookswap-lambda.zip
          retention-days: 3