<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>BookSwap Cloud | 書籍交換平台</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            📚 BookSwap Cloud
        </a>
        <span class="navbar-text text-light">
            雲端書籍交換平台
        </span>
        </div>
    </nav>

    <main class="container py-5">
        <!-- 頁面切換 -->
        <ul class="nav nav-pills mb-4" id="mainTabs">
            <li class="nav-item">
                <button class="nav-link active"
                        id="booksTab"
                        type="button">
                    📚 探索書籍
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link"
                        id="requestsTab"
                        type="button">
                    📋 交換申請
                </button>
            </li>
        </ul>
        <div id="booksSection">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold">探索書籍</h1>
                    <p class="text-muted">
                    找到你喜歡的書，讓閱讀持續流動。
                    </p>
                </div>

                <button
                    class="btn btn-primary"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#addBookModal"
                    >
                    + 新增書籍
                </button>
            </div>

            <div class="mb-4">
                <input
                    id="searchInput"
                    type="search"
                    class="form-control"
                    placeholder="搜尋書名、作者或 ISBN..."
                >
            </div>

            <div id="message" class="mb-3" role="status"></div>

            <div id="bookList" class="row g-4">
            <!-- JavaScript 動態產生書籍卡片 -->
            </div>
        </div> <!-- booksSection -->

        <!-- 交換申請列表 -->
        <section id="requestsSection" class="d-none">
            <div class="d-flex justify-content-between
                        align-items-center mb-4">
                <div>
                    <h1 class="fw-bold">交換申請紀錄</h1>
                    <p class="text-muted">
                        查看目前所有書籍交換申請與處理狀態。
                    </p>
                </div>

                <button class="btn btn-outline-primary"
                        id="refreshRequestsBtn"
                        type="button">
                    重新整理
                </button>
            </div>

            <div id="requestsMessage" role="status"></div>

            <div id="requestsList" class="row g-3">
                <!-- JavaScript 動態產生交換申請 -->
            </div>
        </section>
    </main>

  
    <div class="modal fade" id="addBookModal" tabindex="-1"
        aria-labelledby="addBookModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <form id="addBookForm">
            <div class="modal-header">
            <h5 class="modal-title" id="addBookModalLabel">
                新增書籍
            </h5>
            <button type="button" class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="關閉"></button>
            </div>

            <div class="modal-body">
            <div class="mb-3">
                <label for="bookIsbn" class="form-label">ISBN</label>
                <div class="input-group">
                <input type="text" class="form-control"
                        id="bookIsbn" maxlength="13"
                        placeholder="輸入 ISBN-10 或 ISBN-13">
                <button type="button" class="btn btn-outline-primary"
                        id="lookupIsbnBtn">
                    自動查詢
                </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="bookTitle" class="form-label">書名</label>
                <input type="text" class="form-control"
                    id="bookTitle" required>
            </div>

            <div class="mb-3">
                <label for="bookAuthor" class="form-label">作者</label>
                <input type="text" class="form-control"
                    id="bookAuthor" required>
            </div>

            <div id="formMessage" class="small mb-2" role="status"></div>
            </div>

            <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary"
                    id="saveBookBtn">儲存書籍</button>
            </div>
        </form>
        </div>
    </div>
    </div>

    <div class="modal fade" id="editBookModal" tabindex="-1"
        aria-labelledby="editBookModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editBookModalLabel">
                    編輯書籍
                    </h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>

                <form id="editBookForm">
                    <div class="modal-body">

                    <div class="mb-3">
                        <label for="editBookTitle" class="form-label">
                        書名
                        </label>
                        <input type="text" class="form-control"
                            id="editBookTitle" required>
                    </div>

                    <div class="mb-3">
                        <label for="editBookAuthor" class="form-label">
                        作者
                        </label>
                        <input type="text" class="form-control"
                            id="editBookAuthor" required>
                    </div>

                    <div class="mb-3">
                        <label for="editBookIsbn" class="form-label">
                        ISBN
                        </label>
                        <input type="text" class="form-control"
                            id="editBookIsbn">
                    </div>

                    <p id="editFormMessage" class="small mb-2"></p>
                    </div>

                    <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        取消
                    </button>
                    <button type="submit" class="btn btn-primary"
                            id="updateBookBtn">
                        儲存修改
                    </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- 申請交換 Modal -->
    <div class="modal fade" id="exchangeModal" tabindex="-1"
        aria-labelledby="exchangeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="exchangeForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exchangeModalLabel">
                            申請交換書籍
                        </h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="關閉"></button>
                    </div>

                    <div class="modal-body">
                        <p class="text-muted mb-3">
                            申請書籍：
                            <strong id="exchangeBookTitle"></strong>
                        </p>

                        <div class="mb-3">
                            <label for="requesterName" class="form-label">
                                申請人姓名
                            </label>
                            <input type="text" class="form-control"
                                id="requesterName" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="exchangeMessage" class="form-label">
                                留言（選填）
                            </label>
                            <textarea class="form-control"
                                    id="exchangeMessage"
                                    rows="3" maxlength="1000"></textarea>
                        </div>

                        <div id="exchangeFormMessage"
                            class="small mb-2" role="status"></div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            取消
                        </button>
                        <button type="submit" class="btn btn-primary"
                                id="submitExchangeBtn">
                            送出交換申請
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/app.js"></script>
</body>
</html>
